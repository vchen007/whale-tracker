# nginx site config for the whale tracker
# Install: copy to /etc/nginx/sites-available/whale-tracker, then
#   sudo ln -s /etc/nginx/sites-available/whale-tracker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your registered domain (e.g. tracker.example.com).
# Adjust the `root` path if you cloned somewhere other than /home/deploy/whale-tracker.
#
# certbot (`sudo certbot --nginx -d YOUR_DOMAIN`) will edit this file to add the
# TLS listener on 443 and an HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Built single-page client (output of `npm run build`)
    root /home/deploy/whale-tracker/client/dist;
    index index.html;

    # ── WebSocket live trade feed ────────────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # ── REST API → Fastify on :3001 ──────────────────────────────────────────
    # X-Forwarded-For is required so the server (trustProxy) sees real client
    # IPs for rate-limiting and the per-IP WebSocket cap.
    location ~ ^/(trades|markets|health|categories|auto-trader) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else → SPA (client-side routing) ──────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
